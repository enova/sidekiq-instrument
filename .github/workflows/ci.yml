name: CI

# Test matrix strategy:
# - Sidekiq 4.x-7.x: Compatible with Ruby 2.7-3.3
# - Sidekiq 8.x: Requires Ruby >= 3.2
# - We test representative combinations of Ruby + Sidekiq + Redis/Valkey versions
# - Total: 30 Redis tests + 7 Valkey tests = 37 jobs (down from 175 invalid combinations)

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Sidekiq 4.x: Ruby 2.7-3.3, Redis 4-8
          - ruby-version: 2.7.8
            sidekiq-version: '4'
            redis-version: '4'
          - ruby-version: 2.7.8
            sidekiq-version: '4'
            redis-version: '7'
          - ruby-version: 3.0
            sidekiq-version: '4'
            redis-version: '5'
          - ruby-version: 3.3
            sidekiq-version: '4'
            redis-version: '8'
          
          # Sidekiq 5.x: Ruby 2.7-3.3, Redis 4-8
          - ruby-version: 2.7.8
            sidekiq-version: '5'
            redis-version: '4'
          - ruby-version: 3.1
            sidekiq-version: '5'
            redis-version: '6'
          - ruby-version: 3.3
            sidekiq-version: '5'
            redis-version: '8'
          
          # Sidekiq 6.x: Ruby 2.7-3.3, Redis 4-8
          - ruby-version: 2.7.8
            sidekiq-version: '6'
            redis-version: '4'
          - ruby-version: 3.0
            sidekiq-version: '6'
            redis-version: '5'
          - ruby-version: 3.2
            sidekiq-version: '6'
            redis-version: '7'
          - ruby-version: 3.3
            sidekiq-version: '6'
            redis-version: '8'
          
          # Sidekiq 7.x: Ruby 2.7-3.3, Redis 4-8
          - ruby-version: 2.7.8
            sidekiq-version: '7'
            redis-version: '4'
          - ruby-version: 3.0
            sidekiq-version: '7'
            redis-version: '5'
          - ruby-version: 3.1
            sidekiq-version: '7'
            redis-version: '6'
          - ruby-version: 3.2
            sidekiq-version: '7'
            redis-version: '7'
          - ruby-version: 3.3
            sidekiq-version: '7'
            redis-version: '8'
          
          # Sidekiq 8.x: Ruby 3.2+, Redis 5-8 (Sidekiq 8 requires Ruby >= 3.2)
          - ruby-version: 3.2
            sidekiq-version: '8'
            redis-version: '5'
          - ruby-version: 3.2
            sidekiq-version: '8'
            redis-version: '7'
          - ruby-version: 3.3
            sidekiq-version: '8'
            redis-version: '6'
          - ruby-version: 3.3
            sidekiq-version: '8'
            redis-version: '8'

    steps:
      - name: Checkout project
        uses: actions/checkout@v3

      - name: Create Gemfile for specific Sidekiq version
        run: |
          cat > Gemfile.ci <<EOF
          source 'https://rubygems.org'
          
          gem 'sidekiq', '~> ${{ matrix.sidekiq-version }}.0'
          
          gemspec
          EOF
          cat Gemfile.ci

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: false
        env:
          BUNDLE_GEMFILE: Gemfile.ci

      - name: Install dependencies
        env:
          BUNDLE_GEMFILE: Gemfile.ci
        run: |
          gem install bundler
          bundle install --jobs 4 --retry 3
          echo "=== Installed Sidekiq version ==="
          bundle exec gem list sidekiq

      - name: Start Redis
        uses: supercharge/redis-github-action@1.5.0
        with:
          redis-version: ${{ matrix.redis-version }}

      - name: Run tests
        env:
          BUNDLE_GEMFILE: Gemfile.ci
        run: bundle exec rake

  test-valkey:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Sidekiq 4.x-6.x: Ruby 2.7-3.3, Valkey 7-8
          - ruby-version: 2.7.8
            sidekiq-version: '4'
            valkey-version: '7'
          - ruby-version: 3.3
            sidekiq-version: '5'
            valkey-version: '8'
          - ruby-version: 3.1
            sidekiq-version: '6'
            valkey-version: '7'
          
          # Sidekiq 7.x: Ruby 2.7-3.3, Valkey 7-8
          - ruby-version: 2.7.8
            sidekiq-version: '7'
            valkey-version: '7'
          - ruby-version: 3.2
            sidekiq-version: '7'
            valkey-version: '8'
          
          # Sidekiq 8.x: Ruby 3.2+, Valkey 7-8 (Sidekiq 8 requires Ruby >= 3.2)
          - ruby-version: 3.2
            sidekiq-version: '8'
            valkey-version: '7'
          - ruby-version: 3.3
            sidekiq-version: '8'
            valkey-version: '8'

    services:
      valkey:
        image: valkey/valkey:${{ matrix.valkey-version }}-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout project
        uses: actions/checkout@v3

      - name: Create Gemfile for specific Sidekiq version
        run: |
          cat > Gemfile.ci <<EOF
          source 'https://rubygems.org'
          
          gem 'sidekiq', '~> ${{ matrix.sidekiq-version }}.0'
          
          gemspec
          EOF
          cat Gemfile.ci

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: false
        env:
          BUNDLE_GEMFILE: Gemfile.ci

      - name: Install dependencies
        env:
          BUNDLE_GEMFILE: Gemfile.ci
        run: |
          gem install bundler
          bundle install --jobs 4 --retry 3
          echo "=== Installed Sidekiq version ==="
          bundle exec gem list sidekiq

      - name: Run tests
        env:
          BUNDLE_GEMFILE: Gemfile.ci
        run: bundle exec rake
