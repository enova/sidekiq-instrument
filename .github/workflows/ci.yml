name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: [2.7.8, 3.0, 3.1, 3.2, 3.3]
        redis-version: ['4', '5', '6', '7', '8']
        sidekiq-version: ['4', '5', '6', '7', '8']

    steps:
      - name: Checkout project
        uses: actions/checkout@v3

      - name: Create Gemfile for specific Sidekiq version
        run: |
          cat > Gemfile.ci <<EOF
          source 'https://rubygems.org'
          
          gem 'sidekiq', '~> ${{ matrix.sidekiq-version }}.0'
          
          gemspec
          EOF
          cat Gemfile.ci

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: false
        env:
          BUNDLE_GEMFILE: Gemfile.ci

      - name: Install dependencies
        env:
          BUNDLE_GEMFILE: Gemfile.ci
        run: |
          gem install bundler
          bundle install --jobs 4 --retry 3
          echo "=== Installed Sidekiq version ==="
          bundle exec gem list sidekiq

      - name: Start Redis
        uses: supercharge/redis-github-action@1.5.0
        with:
          redis-version: ${{ matrix.redis-version }}

      - name: Run tests
        env:
          BUNDLE_GEMFILE: Gemfile.ci
        run: bundle exec rake

  test-valkey:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: [2.7.8, 3.0, 3.1, 3.2, 3.3]
        valkey-version: ['7', '8']
        sidekiq-version: ['4', '5', '6', '7', '8']

    services:
      valkey:
        image: valkey/valkey:${{ matrix.valkey-version }}-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout project
        uses: actions/checkout@v3

      - name: Create Gemfile for specific Sidekiq version
        run: |
          cat > Gemfile.ci <<EOF
          source 'https://rubygems.org'
          
          gem 'sidekiq', '~> ${{ matrix.sidekiq-version }}.0'
          
          gemspec
          EOF
          cat Gemfile.ci

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: false
        env:
          BUNDLE_GEMFILE: Gemfile.ci

      - name: Install dependencies
        env:
          BUNDLE_GEMFILE: Gemfile.ci
        run: |
          gem install bundler
          bundle install --jobs 4 --retry 3
          echo "=== Installed Sidekiq version ==="
          bundle exec gem list sidekiq

      - name: Run tests
        env:
          BUNDLE_GEMFILE: Gemfile.ci
        run: bundle exec rake
