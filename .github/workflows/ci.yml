name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: [2.7.8, 3.0, 3.1, 3.2, 3.3]
        redis-version: ['4.0.14', '5.0.14', '6.2.14', '7.2.4', '8.0.1']

    steps:
      - name: Checkout project
        uses: actions/checkout@v3

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically

      - name: Start Redis
        uses: supercharge/redis-github-action@1.5.0
        with:
          redis-version: ${{ matrix.redis-version }}

      - name: Run tests
        run: bundle exec rake
  
  test-valkey:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: [2.7.8, 3.0, 3.1, 3.2, 3.3]
        valkey-version: ['7.2.7', '8.0.1']
    
    services:
      valkey:
        image: valkey/valkey:${{ matrix.valkey-version }}-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout project
        uses: actions/checkout@v3

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically

      - name: Run tests
        run: bundle exec rake
